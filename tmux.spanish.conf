# ============================================================================
#  nachimux · a fancy, Spanish-keyboard-friendly tmux config
# ----------------------------------------------------------------------------
#  Model:   WORKSPACES (sessions)  →  TABS (windows)  →  SPLITS (panes)
#  Status:  lives on TOP (your Claude status stuff owns the bottom)
#  Theme:   Catppuccin Mocha + Nerd Font icons
#  Prefix:  C-b  (the tmux standard: Ctrl + b)
# ============================================================================


# ── Prefix ──────────────────────────────────────────────────────────────────
# Explicitly remove the old custom prefix so reloading also migrates a live server.
unbind C-Space
set -g prefix None
bind C-b send-keys C-b                   # press it twice to send a literal C-b

# Intercept the prefix in the root table, play its cue, then enter tmux's
# normal prefix table. The prefix-table C-b binding above stays untouched, so
# pressing C-b twice still sends one literal C-b and only plays one cue.
bind -n C-b run-shell -b \
  '"#{@nachimux_root}/scripts/play-confirm-sound.sh" "#{@nachimux_root}/sounds/tmux-prefix-ready.mp3"' \; \
  switch-client -T prefix \; refresh-client -S

# Resolve helper scripts from this file's directory, wherever the repo lives.
set -gF @nachimux_root '#{d:current_file}'
set-environment -gF NACHIMUX_ROOT '#{d:current_file}'

# ── Core behaviour ───────────────────────────────────────────────────────────
set  -g mouse on                         # click tabs/panes, drag borders, scroll
set  -g base-index 1                     # tabs start at 1 (matches the number row)
setw -g pane-base-index 1
set  -g renumber-windows on              # keep tab numbers gapless
set  -g history-limit 50000
set  -sg escape-time 10                  # snappy Esc (Esc = copy mode below)
set  -g focus-events on
set  -g set-clipboard on                 # let apps use the system clipboard
setw -g mode-keys vi                     # vi motions in copy mode
set  -g detach-on-destroy off            # closing last tab jumps to next workspace

# truecolor — the theme depends on it
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"


# ════════════════════════════════════════════════════════════════════════════
#  WORKSPACES  (tmux sessions)
# ════════════════════════════════════════════════════════════════════════════
#  prefix w   → fuzzy workspace switcher (create / switch / rename / delete)
#  prefix (   → previous workspace          prefix )  → next workspace
#  prefix d   → detach (leave everything running in the background)
# Direct actions play the same quiet cue as palette selections. run-shell -b
# keeps playback off the critical path so shortcuts remain instantaneous.
bind -r ( run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; switch-client -p
bind -r ) run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; switch-client -n
bind d    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; detach-client
bind '$'  run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; command-prompt -I "#S" "rename-session '%%'"


# ════════════════════════════════════════════════════════════════════════════
#  TABS  (tmux windows) — shown centered on the top bar
# ════════════════════════════════════════════════════════════════════════════
bind t    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; new-window -c "#{pane_current_path}"
bind Tab  run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; next-window
bind BTab run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; previous-window
bind ,    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; command-prompt -I "#W" "rename-window '%%'"
bind X    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; kill-window
bind -r < run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; swap-window -t -1 \; previous-window
bind -r > run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; swap-window -t +1 \; next-window
bind f    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; command-prompt { find-window -Z "%%" }
bind 1    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-window -t :=1
bind 2    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-window -t :=2
bind 3    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-window -t :=3
bind 4    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-window -t :=4
bind 5    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-window -t :=5
bind 6    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-window -t :=6
bind 7    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-window -t :=7
bind 8    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-window -t :=8
bind 9    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-window -t :=9


# ════════════════════════════════════════════════════════════════════════════
#  SPLITS  (tmux panes) — the "subtabs" inside a tab
# ════════════════════════════════════════════════════════════════════════════
bind - run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; split-window -v -c "#{pane_current_path}"
bind = run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; split-window -h -c "#{pane_current_path}"
# move between splits — vim style (arrows work too)
bind h        run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-pane -L
bind j        run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-pane -D
bind k        run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-pane -U
bind l        run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-pane -R
bind -r Left  run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-pane -L
bind -r Down  run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-pane -D
bind -r Up    run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-pane -U
bind -r Right run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-pane -R
# resize splits — hold Shift, repeatable
bind -r H run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; resize-pane -L 5
bind -r J run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; resize-pane -D 5
bind -r K run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; resize-pane -U 5
bind -r L run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; resize-pane -R 5
bind z     run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; resize-pane -Z
bind Space run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; next-layout
bind !     run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; break-pane
bind e     run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-layout tiled
bind x     run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind o     run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; select-pane -t :.+


# ════════════════════════════════════════════════════════════════════════════
#  COPY / CLIPBOARD  (no AltGr — the whole point of the ES profile)
# ════════════════════════════════════════════════════════════════════════════
bind Escape run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; copy-mode
bind P      run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; paste-buffer
bind -T copy-mode-vi v run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; send -X begin-selection
bind -T copy-mode-vi y run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel


# ── Command palette:  prefix p  (fuzzy "action palette") ─────────────────────
# display-popup does not expand tmux formats in its shell command, so use the
# global environment path above instead of passing a literal #{@nachimux_root}.
bind p display-popup -E -w 72% -h 72% -T " nachimux · palette " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/palette.sh"'
# prefix a — same palette, a friendlier one-hand reach (kept alongside prefix p).
bind a display-popup -E -w 72% -h 72% -T " nachimux · palette " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/palette.sh"'

# Searchable reference: same registry as the palette, focused on learning.
bind / run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; \
  display-popup -E -w 82% -h 82% -T " nachimux · shortcuts " \
  'exec /bin/bash "$NACHIMUX_ROOT/nachimux"'

# ── Workspace sidebar: DESHABILITADO ─────────────────────────────────────────
# El sidebar (columna izquierda casera) se quitó: era confuso y buggy. Los
# workspaces se manejan solo con `prefix w` (switcher) y `prefix ( / )`.
# El click de mouse vuelve al comportamiento nativo de tmux (mouse on ya basta).

# ── Reload:  prefix r ────────────────────────────────────────────────────────
bind r run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; \
  source-file ~/.tmux.conf \; display "  config reloaded"
bind : run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; command-prompt
bind ? run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; list-keys -N


# ════════════════════════════════════════════════════════════════════════════
#  STATUS BAR  →  TOP
# ════════════════════════════════════════════════════════════════════════════
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify "absolute-centre"              # tabs dead-center
set -g status-left-length 120
set -g status-right-length 160


# ════════════════════════════════════════════════════════════════════════════
#  PLUGINS  (TPM)   —   prefix I install · prefix U update
# ════════════════════════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'              # copy → system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'         # save/restore layouts
set -g @plugin 'tmux-plugins/tmux-continuum'         # auto-save + restore on boot
set -g @plugin 'tmux-plugins/tmux-cpu'               # cpu/ram module for the bar
set -g @plugin 'tmux-plugins/tmux-battery'           # battery module for the bar
set -g @plugin 'omerxx/tmux-sessionx'                # fuzzy WORKSPACE switcher
set -g @plugin 'catppuccin/tmux#v2.3.0'              # the pretty

# resurrect / continuum
# Auto-restore OFF: al abrir tmux arrancás con una sesión limpia, no se restaura
# nada guardado. El guardado/restaurado manual sigue disponible (prefix C-s / C-r).
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# sessionx — the workspace switcher popup
set -g @sessionx-bind 'w'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths ''                     # no folder clutter — only real workspaces
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-filter-current 'false'

# ── Catppuccin theme (set BEFORE tpm loads it) ──────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_flags 'none'               # no flag glyph (kills the □ tofu)
set -g @catppuccin_window_text ' #W'                 # inactive tab label
set -g @catppuccin_window_current_text ' #W'         # active tab label


# ── Boot TPM — MUST stay the LAST line of the plugin/theme section ───────────
run '~/.tmux/plugins/tpm/tpm'

# TPM installs its own bindings while loading. Rebind the actions documented by
# nachimux after TPM so direct plugin shortcuts get the cue too.
# Workspace switcher: tmux's native choose-tree (zoomed, session level).
# unbind W explicitly so reloading a live server also drops the old switcher.
unbind W
bind w   run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; choose-tree -Zs
bind C-s run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh
bind C-r run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh
bind I   run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; run-shell ~/.tmux/plugins/tpm/bindings/install_plugins
bind U   run-shell -b "#{@nachimux_root}/scripts/play-confirm-sound.sh" \; run-shell ~/.tmux/plugins/tpm/bindings/update_plugins


# ════════════════════════════════════════════════════════════════════════════
#  STATUS CONTENT  (set AFTER tpm so catppuccin's modules exist)
#    left  = workspace name        center = tabs        right = cpu/ram/batt/clock
# ════════════════════════════════════════════════════════════════════════════
# calm palette: mute cpu + battery to surface grey, let the clock be the accent
set -g @catppuccin_status_cpu_icon_bg     "#45475a"
set -g @catppuccin_status_cpu_text_bg     "#313244"
set -g @cpu_low_bg_color    "#45475a"
set -g @cpu_medium_bg_color "#45475a"
set -g @cpu_high_bg_color   "#45475a"
set -g @cpu_low_fg_color    "#cdd6f4"
set -g @cpu_medium_fg_color "#cdd6f4"
set -g @cpu_high_fg_color   "#cdd6f4"
set -g @catppuccin_status_battery_icon_bg   "#45475a"
set -g @catppuccin_status_battery_icon_fg   "#cdd6f4"
set -g @catppuccin_status_date_time_icon_bg "#cba6f7"   # mauve = the one accent
set -g @catppuccin_date_time_text " %H:%M"

set -g status-left "#{E:@catppuccin_status_session}"
# Prefix feedback: while tmux waits for the command key, replace the normal
# right-side modules with a compact cheat strip. It clears on the next key.
set -g @nachimux_status_right_normal ""
set -agF @nachimux_status_right_normal "#{E:@catppuccin_status_cpu}"
set -agF @nachimux_status_right_normal "#{E:@catppuccin_status_battery}"
set -ag  @nachimux_status_right_normal "#{E:@catppuccin_status_date_time}"
# The prefix cheat strip is data-driven now: scripts/prefix-hint.sh renders your
# pinned shortcuts into @nachimux_prefix_hint. Toggle which ones show from the
# palette -> "Customize the prefix hint bar". Pins live in a state file and are
# rebuilt on every reload (below), so nothing changes until you customize.
set -g @nachimux_prefix_hint ""
set -g status-right "#{?client_prefix,#{E:@nachimux_prefix_hint},#{E:@nachimux_status_right_normal}}"
run-shell -b "#{@nachimux_root}/scripts/prefix-hint.sh build"

# ── Clean rounded tabs (explicit colors — avoids catppuccin's reverse/none) ──
# Left cap  and right cap  are drawn in the pill's own color on the bar's
# background, so they blend instead of showing notches / stray colors.
set -g window-status-separator ""
set -g window-status-format "#[fg=#313244,bg=default]#[fg=#a6adc8,bg=#313244] #W #[fg=#6c7086]#I #[fg=#313244,bg=default]"
set -g window-status-current-format "#{?client_prefix,#[fg=#00ff00]#[bg=default]#[fg=#11111b]#[bg=#00ff00]#[bold] #W #[fg=#11111b]#I #[fg=#00ff00]#[bg=default]#[default],#[fg=#cba6f7]#[bg=default]#[fg=#11111b]#[bg=#cba6f7]#[bold] #W #[fg=#11111b]#I #[fg=#cba6f7]#[bg=default]#[default]}"
