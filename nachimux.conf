# ============================================================================
#  nachimux · a tmux config that behaves like a browser
# ----------------------------------------------------------------------------
#  Built for a Spanish keyboard: no binding needs AltGr, which on that layout
#  is where [ ] { } | \ ~ live. It works fine on any other layout too.
# ----------------------------------------------------------------------------
#  Model:   WORKSPACES (sessions)  →  TABS (windows)  →  SPLITS (panes)
#  Status:  lives on TOP (your Claude status stuff owns the bottom)
#  Theme:   Catppuccin Mocha + Nerd Font icons
#  Prefix:  C-b  (the tmux standard: Ctrl + b)
# ============================================================================


# ── Prefix ──────────────────────────────────────────────────────────────────
# Explicitly remove the old custom prefix so reloading also migrates a live server.
unbind C-Space
set -g prefix None
bind C-b send-keys C-b                   # press it twice to send a literal C-b

# Intercept the prefix in the root table, play its cue, then enter tmux's
# normal prefix table. The prefix-table C-b binding above stays untouched, so
# pressing C-b twice still sends one literal C-b and only plays one cue.
bind -n C-b run-shell -b "#{@nachimux_cue_prefix}" \; \
  switch-client -T prefix \; refresh-client -S

# Resolve helper scripts from this file's directory, wherever the repo lives.
set -gF @nachimux_root '#{d:current_file}'
set-environment -gF NACHIMUX_ROOT '#{d:current_file}'

# Resolve the cue player ONCE into a ready-to-exec command, and publish it as an
# option. Every action key below then runs `#{@nachimux_cue_action}` instead of
# carrying a script path -- and muting is just swapping that option to `:`, so a
# muted keypress has nothing behind it. scripts/cue.sh owns both.
run-shell "#{@nachimux_root}/scripts/cue.sh init"
run-shell -b "#{@nachimux_root}/scripts/attention.sh"
run-shell -b "#{@nachimux_root}/scripts/git-status.sh '#{pane_current_path}'"
run-shell -b "#{@nachimux_root}/scripts/focus.sh size"

# ── Core behaviour ───────────────────────────────────────────────────────────
set  -g mouse on                         # click tabs/panes, drag borders, scroll
set  -g base-index 1                     # tabs start at 1 (matches the number row)
setw -g pane-base-index 1
set  -g renumber-windows on              # keep tab numbers gapless

# ── Tabs name themselves until you have an opinion ─────────────────────────
# A new tab inherits the directory but not an identity, so it opens as "zsh"
# and stays that way unless you stop and name it. Auto-naming answers the two
# useful questions instead: in a shell, WHERE you are; running something, WHAT
# is running.
#
# Renaming by hand is permanent, and tmux already guarantees that -- rename-window
# turns automatic-rename off for that window -- so every tab you have already
# named is untouched by this. Only the ones you never bothered with move.
#
# ssh is deliberately NOT treated as a shell: when you are on another machine,
# "ssh" is the more useful label than whatever your local directory happens to
# be. Hence an explicit list rather than a *sh glob, which would swallow it.
set  -g automatic-rename on
set  -g automatic-rename-format "#{?#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{||:#{==:#{pane_current_command},fish},#{==:#{pane_current_command},sh}}}},#{b:pane_current_path},#{pane_current_command}}"
set  -g history-limit 50000
set  -sg escape-time 10                  # snappy Esc (Esc = copy mode below)
set  -g focus-events on
set  -g set-clipboard on                 # let apps use the system clipboard
setw -g mode-keys vi                     # vi motions in copy mode
set  -g detach-on-destroy off            # closing last tab jumps to next workspace

# truecolor — the theme depends on it
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# Synchronized output (DEC private mode 2026). Ghostty supports it, but its
# terminfo doesn't advertise the capability, so tmux redraws NON-atomically: when
# a background pane repaints, tmux writes that update and only then paints the
# popup/overlay on top — you see the background flash through for a frame. Telling
# tmux the terminal has `sync` makes it wrap every screen update in 2026, so each
# frame lands atomically and the flicker is gone. Matches client_termname
# (xterm-ghostty), the OUTER terminal tmux writes to. Applies on next attach.
set  -as terminal-features "xterm-ghostty:sync"


# ════════════════════════════════════════════════════════════════════════════
#  WORKSPACES  (tmux sessions)
# ════════════════════════════════════════════════════════════════════════════
#  prefix w   → workspace switcher (choose-tree: Enter opens, x kills, F1 help)
#  prefix N   → new workspace              prefix $  → rename workspace
#  prefix (   → previous workspace         prefix )  → next workspace
#  prefix B   → last workspace (toggle back to the one you came from)
#  prefix d   → detach (leave everything running in the background)
# choose-tree can switch/kill but not create — hence a dedicated "new" key.
# Direct actions play the same quiet cue as palette selections. run-shell -b
# keeps playback off the critical path so shortcuts remain instantaneous.
bind -r ( run-shell -b "#{@nachimux_cue_action}" \; switch-client -p
bind -r ) run-shell -b "#{@nachimux_cue_action}" \; switch-client -n
bind d    run-shell -b "#{@nachimux_cue_action}" \; detach-client
bind '$'  run-shell -b "#{@nachimux_cue_action}" \; command-prompt -I "#S" "rename-session '%%'"
bind N    run-shell -b "#{@nachimux_cue_action}" \; command-prompt -p "new workspace name:" "new-session -s '%%'"
# prefix W — workspaces by RECENCY, not position. ( and ) walk the list in
# whatever order tmux keeps them in, which has nothing to do with where you have
# actually been. Same finder as the tabs, opened on its workspaces mode; the tab
# MRU and the workspace MRU are separate lists on purpose, so bouncing between
# four tabs of one project cannot evict every other project.
bind W    run-shell "tmux set-environment -g NACHI_FIND_MODE ws ; tmux set-environment -g NACHI_FIND_SESSION '#{session_id}' ; tmux set-environment -g NACHI_FIND_WINDOW '#{window_id}'" \; \
  display-popup -E -w 56% -h 60% -T " nachimux · workspaces " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/find.sh"'
# (prefix B moved to the TABS section — it's now the "recent tabs" MRU switcher.)
# ── prefix g / f / B / n : one finder, four doors ───────────────────────────
# The same list every time; the key you press only picks which filter it opens
# on, and ctrl-a / ctrl-r / ctrl-n switch between them once it is up. So a
# wrong guess costs a keystroke instead of closing and reopening something
# else. See scripts/find.sh for why prefix w is deliberately NOT in here.
#
# display-popup does NOT expand tmux formats in its shell command, so the
# mode and the "you are here" ids go through the global environment first --
# run-shell does expand them. jump.sh wanted exactly this and never got it:
# it read JUMP_SESSION/JUMP_WINDOW that nothing ever set, so its current-tab
# marker had never once appeared.
bind g    run-shell "tmux set-environment -g NACHI_FIND_MODE all ; tmux set-environment -g NACHI_FIND_SESSION '#{session_id}' ; tmux set-environment -g NACHI_FIND_WINDOW '#{window_id}'" \; \
  display-popup -E -w 64% -h 70% -T " nachimux · find a tab " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/find.sh"'
# Reorder tabs in THIS workspace: pick-up / put-down TUI (↑↓ select, Enter grab,
# ↑↓ move — edges rotate like < / >). We stash the session_id in a tmux env var
# first (run-shell expands #{session_id}); the popup reads $REORDER_SESSION.
bind G    run-shell "tmux set-environment -g REORDER_SESSION '#{session_id}'" \; \
  display-popup -E -w 50% -h 70% -T " nachimux · reorder tabs " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/reorder-tabs.sh"'


# ════════════════════════════════════════════════════════════════════════════
#  TABS  (tmux windows) — shown centered on the top bar
# ════════════════════════════════════════════════════════════════════════════
bind t    run-shell -b "#{@nachimux_cue_action}" \; new-window -c "#{pane_current_path}"
bind Tab  run-shell -b "#{@nachimux_cue_action}" \; next-window
bind BTab run-shell -b "#{@nachimux_cue_action}" \; previous-window
bind ,    run-shell -b "#{@nachimux_cue_action}" \; command-prompt -I "#W" "rename-window '%%'"
# Destructive keys ask, and they ask in exactly the words data/cheatsheet.tsv
# promises in its confirm column -- the palette builds its prompt as
# `confirm-before -p "<confirm> (y/n)"`, so the hotkey and the palette are now
# literally the same sentence. Before this, X killed a whole tab silently while
# x asked about a single split: the riskier key was the unguarded one.
bind X    run-shell -b "#{@nachimux_cue_action}" \; confirm-before -p "Close this tab? (y/n)" kill-window
# Move this tab left/right. In the middle it's an adjacent swap; at the edge it
# ROTATES (last→first shifts the rest right, not a swap of the two ends). See
# scripts/move-tab.sh. Foreground so rapid -r repeats stay ordered.
bind -r < run-shell -b "#{@nachimux_cue_action}" \; run-shell "#{@nachimux_root}/scripts/move-tab.sh '#{session_id}' '#{window_index}' left"
bind -r > run-shell -b "#{@nachimux_cue_action}" \; run-shell "#{@nachimux_root}/scripts/move-tab.sh '#{session_id}' '#{window_index}' right"
# find-by-name is just the finder with the cursor in the search box.
bind f    run-shell "tmux set-environment -g NACHI_FIND_MODE all ; tmux set-environment -g NACHI_FIND_SESSION '#{session_id}' ; tmux set-environment -g NACHI_FIND_WINDOW '#{window_id}'" \; \
  display-popup -E -w 64% -h 70% -T " nachimux · find a tab " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/find.sh"'
bind m    run-shell -b "#{@nachimux_cue_action}" \; choose-tree -Zs "move-window -t '%%'"
# "back" (prefix b): toggle to the last tab — but only if you've actually
# switched tabs since entering this workspace. If you just arrived and haven't
# touched a tab yet, jump to the last workspace instead. Two global hooks keep a
# per-workspace @tab_switched flag: cleared when you enter a workspace, raised on
# any tab switch. Event-driven (no polling); each hook body is a single `set`.
# (These hook names are distinct from the client-*-theme hooks below.)
set -g @tab_switched 0                                    # safe default before any switch
# These two navigation hooks feed BOTH MRU lists (recent tabs, recent workspaces).
# Quote the ids. A session_id is literally `$0`, `$2`, `$305` -- unquoted in a
# run-shell command the shell expands it as a positional parameter, and `$0`
# becomes "sh". window_id starts with @ and is harmless, but quote both so the
# next id format cannot bite. Note the hook body has to be DOUBLE quoted for
# that: a tmux single-quoted string cannot contain a single quote, so keeping
# the old '...' body would just end it early and leave the hook empty.
# These two navigation hooks also feed the global recent-tabs MRU (prefix B):
# record-mru.sh pushes the landed-on window_id. (pane-focus-in does NOT fire on
# window switches — only real pane/terminal focus — so it's the wrong hook for
# this; session-window-changed / client-session-changed fire on every switch.)
set-hook -g client-session-changed "set @tab_switched 0 ; run-shell -b \"#{@nachimux_root}/scripts/record-mru.sh '#{window_id}' '#{session_id}'\" ; run-shell -b \"#{@nachimux_root}/scripts/git-status.sh '#{pane_current_path}'\""  # entered a workspace → reset + record
set-hook -g session-window-changed "set @tab_switched 1 ; run-shell -b \"#{@nachimux_root}/scripts/record-mru.sh '#{window_id}' '#{session_id}'\" ; run-shell -b \"#{@nachimux_root}/scripts/git-status.sh '#{pane_current_path}'\""  # switched a tab → raise + record
bind b    run-shell -b "#{@nachimux_cue_action}" \; if-shell -F '#{@tab_switched}' 'last-window' 'switch-client -l'
# "recent tabs" (prefix B): the finder, opened on the global MRU that the
# session-window-changed / client-session-changed hooks keep (record-mru.sh).
bind B    run-shell "tmux set-environment -g NACHI_FIND_MODE recent ; tmux set-environment -g NACHI_FIND_SESSION '#{session_id}' ; tmux set-environment -g NACHI_FIND_WINDOW '#{window_id}'" \; \
  display-popup -E -w 64% -h 70% -T " nachimux · recent tabs " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/find.sh"'

# ── FOCUS workspace (prefix F add · prefix U remove · prefix C-f pick) ───────
# A "FOCUS" workspace holds LINKED tabs: the same window shown in two places at
# once — same window_id, same pane PIDs, one set of processes. Not a copy. Each
# workspace still keeps its own current tab, so moving around inside FOCUS does
# not drag the real workspace along with it.
#
# Because it is one window and not two, the removal verb is the whole story:
#     prefix X  (kill-window)    kills the tab in EVERY workspace it's in
#     prefix U  (unlink-window)  removes it from THIS workspace only
# focus.sh refuses to unlink a tab that is linked nowhere else, so "take it out
# of my view" can never quietly become "destroy it". Killing the FOCUS session
# itself is always safe — the linked tabs live on in their home workspace.
#
# Careful with sizes: window-size is `latest`, so a shared tab is resized by
# whichever client touched it last. Attaching to FOCUS from a small terminal
# shrinks that tab in the real workspace too. `set -g window-size largest` if
# that bites (the small client then pans instead of shrinking everyone).
bind F    run-shell -b "#{@nachimux_cue_action}" \; \
  run-shell "#{@nachimux_root}/scripts/focus.sh add '#{window_id}'"
bind U    run-shell -b "#{@nachimux_cue_action}" \; \
  run-shell "#{@nachimux_root}/scripts/focus.sh unlink '#{session_id}' '#{window_index}' '#{window_id}' '#{window_linked_sessions}'"
bind C-f  run-shell -b "#{@nachimux_cue_action}" \; \
  display-popup -E -w 60% -h 60% -T " nachimux · focus " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/focus.sh" pick'
# ── prefix 1 … 9 : one key, two meanings, decided by your actual tabs ───────
# The number row reaches 9, but tabs do not stop there. Rather than bolt tabs
# 10+ onto a separate key, the digit you already press becomes the question:
#
#     no tabs 10-19 exist   prefix 1          -> tab 1     (nothing to ask)
#     tabs 10-19 exist      prefix 1 Enter    -> tab 1
#                           prefix 1 2        -> tab 12
#
# So a digit only ever asks a second question when a second answer exists, and
# on a workspace with nine tabs or fewer NOTHING changes -- prefix 3 is still
# one keystroke. has-decade.sh checks live rather than caching a flag, so
# killing or renumbering tabs can never leave the answer stale.
#
# While it is asking, the tab bar answers with it: tab N lights up as "Enter
# takes you here" and every tab in the decade lights its second digit, which
# with the two tab rows means the row you are looking at is the digit you type.

bind 1 if-shell "#{@nachimux_root}/scripts/has-decade.sh 1 '#{session_id}'" "set -g @nachimux_tens 1 ; switch-client -T tabsN ; refresh-client -S" "run-shell -b '#{@nachimux_cue_action}' ; select-window -t :=1"
bind 2 if-shell "#{@nachimux_root}/scripts/has-decade.sh 2 '#{session_id}'" "set -g @nachimux_tens 2 ; switch-client -T tabsN ; refresh-client -S" "run-shell -b '#{@nachimux_cue_action}' ; select-window -t :=2"
bind 3 if-shell "#{@nachimux_root}/scripts/has-decade.sh 3 '#{session_id}'" "set -g @nachimux_tens 3 ; switch-client -T tabsN ; refresh-client -S" "run-shell -b '#{@nachimux_cue_action}' ; select-window -t :=3"
bind 4 if-shell "#{@nachimux_root}/scripts/has-decade.sh 4 '#{session_id}'" "set -g @nachimux_tens 4 ; switch-client -T tabsN ; refresh-client -S" "run-shell -b '#{@nachimux_cue_action}' ; select-window -t :=4"
bind 5 if-shell "#{@nachimux_root}/scripts/has-decade.sh 5 '#{session_id}'" "set -g @nachimux_tens 5 ; switch-client -T tabsN ; refresh-client -S" "run-shell -b '#{@nachimux_cue_action}' ; select-window -t :=5"
bind 6 if-shell "#{@nachimux_root}/scripts/has-decade.sh 6 '#{session_id}'" "set -g @nachimux_tens 6 ; switch-client -T tabsN ; refresh-client -S" "run-shell -b '#{@nachimux_cue_action}' ; select-window -t :=6"
bind 7 if-shell "#{@nachimux_root}/scripts/has-decade.sh 7 '#{session_id}'" "set -g @nachimux_tens 7 ; switch-client -T tabsN ; refresh-client -S" "run-shell -b '#{@nachimux_cue_action}' ; select-window -t :=7"
bind 8 if-shell "#{@nachimux_root}/scripts/has-decade.sh 8 '#{session_id}'" "set -g @nachimux_tens 8 ; switch-client -T tabsN ; refresh-client -S" "run-shell -b '#{@nachimux_cue_action}' ; select-window -t :=8"
bind 9 if-shell "#{@nachimux_root}/scripts/has-decade.sh 9 '#{session_id}'" "set -g @nachimux_tens 9 ; switch-client -T tabsN ; refresh-client -S" "run-shell -b '#{@nachimux_cue_action}' ; select-window -t :=9"

# The follow-up key. Enter takes the single-digit tab, a digit takes the
# two-digit one. select-window -t does not expand formats, so the target has
# to be built in a shell -- backgrounded so neither call blocks the switch.
bind -T tabsN Enter run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}'"
bind -T tabsN 0 run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}0'"
bind -T tabsN 1 run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}1'"
bind -T tabsN 2 run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}2'"
bind -T tabsN 3 run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}3'"
bind -T tabsN 4 run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}4'"
bind -T tabsN 5 run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}5'"
bind -T tabsN 6 run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}6'"
bind -T tabsN 7 run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}7'"
bind -T tabsN 8 run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}8'"
bind -T tabsN 9 run-shell -b "#{@nachimux_cue_action}" \; run-shell -b "tmux select-window -t ':=#{@nachimux_tens}9'"
# One-shot either way: tmux returns to the root table after the next key, and
# these leave early without moving you.
bind -T tabsN Escape switch-client -T root \; refresh-client -S
bind -T tabsN BSpace switch-client -T root \; refresh-client -S
bind -T tabsN q      switch-client -T root \; refresh-client -S
bind -T tabsN C-c    switch-client -T root \; refresh-client -S


# ════════════════════════════════════════════════════════════════════════════
#  ATTENTION  — which tabs are asking for you (Claude turns, bells)   prefix n
# ════════════════════════════════════════════════════════════════════════════
# A tab "asks for you" when @attention is set — Claude Code's Stop/Notification
# hooks flag it via scripts/claude-attention-hook.sh (wired in ~/.claude/
# settings.json) — or when it rings the terminal bell. prefix n pops a lettered
# menu of them; press the letter to jump. Focusing a tab clears @attention;
# selecting it clears the bell. You're never flagged for the tab you're on.
set -g monitor-bell on        # notice bells from any program…
set -g bell-action other      # …but not the tab you're already on
set -g visual-bell off        # no beep/flash — the menu is the surface
# Focusing a pane drops that pane's flag and selecting a tab clears its bell --
# both change the count, so both recount. So does a bell arriving, and a window going away
# while still flagged. The Claude hook recounts itself, since it runs outside
# tmux's hook system. A window going away while flagged also changes the count,
# and that recount rides along on the window-unlinked hook further down --
# see the note there about why it cannot be declared twice.
# Clearing is per-PANE now: looking at one split does not answer for the other
# three. attention.sh drops the tab's flag only once no pane in it is waiting.
set-hook -g pane-focus-in   "run-shell -b \"#{@nachimux_root}/scripts/attention.sh clear '#{pane_id}'\" ; run-shell -b \"#{@nachimux_root}/scripts/git-status.sh '#{pane_current_path}'\""
set-hook -g alert-bell      'run-shell -b "#{@nachimux_root}/scripts/attention.sh"'
# prefix n → the finder, opened on just the tabs asking for you.
bind n    run-shell "tmux set-environment -g NACHI_FIND_MODE needs ; tmux set-environment -g NACHI_FIND_SESSION '#{session_id}' ; tmux set-environment -g NACHI_FIND_WINDOW '#{window_id}'" \; \
  display-popup -E -w 64% -h 70% -T " nachimux · needs you " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/find.sh"'


# ════════════════════════════════════════════════════════════════════════════
#  SPLITS  (tmux panes) — the "subtabs" inside a tab
# ════════════════════════════════════════════════════════════════════════════
bind - run-shell -b "#{@nachimux_cue_action}" \; split-window -v -c "#{pane_current_path}"
bind = run-shell -b "#{@nachimux_cue_action}" \; split-window -h -c "#{pane_current_path}"
# move between splits — vim style (arrows work too)
bind h        run-shell -b "#{@nachimux_cue_action}" \; select-pane -L
bind j        run-shell -b "#{@nachimux_cue_action}" \; select-pane -D
bind k        run-shell -b "#{@nachimux_cue_action}" \; select-pane -U
bind l        run-shell -b "#{@nachimux_cue_action}" \; select-pane -R
bind -r Left  run-shell -b "#{@nachimux_cue_action}" \; select-pane -L
bind -r Down  run-shell -b "#{@nachimux_cue_action}" \; select-pane -D
bind -r Up    run-shell -b "#{@nachimux_cue_action}" \; select-pane -U
bind -r Right run-shell -b "#{@nachimux_cue_action}" \; select-pane -R
# resize splits — hold Shift, repeatable
bind -r H run-shell -b "#{@nachimux_cue_action}" \; resize-pane -L 5
bind -r J run-shell -b "#{@nachimux_cue_action}" \; resize-pane -D 5
bind -r K run-shell -b "#{@nachimux_cue_action}" \; resize-pane -U 5
bind -r L run-shell -b "#{@nachimux_cue_action}" \; resize-pane -R 5
bind z     run-shell -b "#{@nachimux_cue_action}" \; resize-pane -Z
bind Space run-shell -b "#{@nachimux_cue_action}" \; next-layout
bind !     run-shell -b "#{@nachimux_cue_action}" \; break-pane
bind e     run-shell -b "#{@nachimux_cue_action}" \; select-layout tiled
bind x     run-shell -b "#{@nachimux_cue_action}" \; confirm-before -p "Close this split? (y/n)" kill-pane
bind o     run-shell -b "#{@nachimux_cue_action}" \; select-pane -t :.+
# o steps to the next split; O rotates every split through the layout.
bind O     run-shell -b "#{@nachimux_cue_action}" \; rotate-window



# ════════════════════════════════════════════════════════════════════════════
#  COPY / CLIPBOARD  (no AltGr — the whole point of the ES profile)
# ════════════════════════════════════════════════════════════════════════════
bind Escape run-shell -b "#{@nachimux_cue_action}" \; copy-mode
bind P      run-shell -b "#{@nachimux_cue_action}" \; paste-buffer
bind -T copy-mode-vi v run-shell -b "#{@nachimux_cue_action}" \; send -X begin-selection
bind -T copy-mode-vi y run-shell -b "#{@nachimux_cue_action}" \; send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel


# ── Command palette:  prefix p  (fuzzy "action palette") ─────────────────────
# display-popup does not expand tmux formats in its shell command, so use the
# global environment path above instead of passing a literal #{@nachimux_root}.
bind p display-popup -E -w 72% -h 72% -T " nachimux · palette " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/palette.sh"'
# prefix a — same palette, a friendlier one-hand reach (kept alongside prefix p).
bind a display-popup -E -w 72% -h 72% -T " nachimux · palette " \
  'exec /bin/bash "$NACHIMUX_ROOT/scripts/palette.sh"'

# Searchable reference: same registry as the palette, focused on learning.
bind / run-shell -b "#{@nachimux_cue_action}" \; \
  display-popup -E -w 82% -h 82% -T " nachimux · shortcuts " \
  'exec /bin/bash "$NACHIMUX_ROOT/nachimux"'

# ── Workspace sidebar: REMOVED ──────────────────────────────────────────────
# There used to be a hand-rolled sidebar down the left. It was confusing and
# buggy, so it is gone: workspaces are reached with `prefix w` (the switcher),
# `prefix W` (by recency) and `prefix ( / )`. Mouse clicks are back to plain
# tmux behaviour, which `mouse on` already gives us.

# ── Reload:  prefix r ────────────────────────────────────────────────────────
bind r run-shell -b "#{@nachimux_cue_action}" \; \
  source-file ~/.tmux.conf \; display "  config reloaded"
bind : run-shell -b "#{@nachimux_cue_action}" \; command-prompt
bind ? run-shell -b "#{@nachimux_cue_action}" \; list-keys -N
# prefix M — mute / unmute the cues. Takes tmux's select-pane -M, which this
# profile never used. Unmuting plays the cue as its own confirmation; muting
# says so in a message, and the status bar keeps saying so for as long as it
# lasts, so you can never be muted without knowing.
bind M run-shell -b "#{@nachimux_root}/scripts/cue.sh toggle"
# prefix D — "not this time" for the saved-layout offer. Takes tmux's
# choose-client, which this profile never used. Dismissal lasts as long as the
# server does, so a fresh one asks again -- which is the only moment it matters.
bind D run-shell -b "#{@nachimux_root}/scripts/restore-hint.sh dismiss"


# ════════════════════════════════════════════════════════════════════════════
#  STATUS BAR  →  TOP
# ════════════════════════════════════════════════════════════════════════════
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify "absolute-centre"              # tabs dead-center
set -g status-left-length 120
set -g status-right-length 160


# ════════════════════════════════════════════════════════════════════════════
#  PLUGINS  (TPM)   —   prefix I install · prefix C-u update
# ════════════════════════════════════════════════════════════════════════════
# TPM binds its own keys when it loads (below), which is AFTER the bindings up
# top — so its default update key would silently take prefix U back off the
# FOCUS unlink. Move TPM's key at the source rather than racing it: this is the
# option it reads, so nothing later has to undo anything.
set -g @tpm-update 'C-u'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'              # copy → system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'         # save/restore layouts
set -g @plugin 'tmux-plugins/tmux-continuum'         # auto-save + restore on boot
set -g @plugin 'tmux-plugins/tmux-cpu'               # cpu/ram module for the bar
set -g @plugin 'tmux-plugins/tmux-battery'           # battery module for the bar
set -g @plugin 'catppuccin/tmux#v2.3.0'              # the pretty

# resurrect / continuum
# Auto-restore stays OFF: opening tmux gives you a clean session, never a
# restored one. Saving and restoring by hand is still there (prefix C-s / C-r),
# and scripts/restore-hint.sh offers the newest save without ever taking it.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# ── Catppuccin theme (set BEFORE tpm loads it) ──────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_flags 'none'               # no flag glyph (kills the □ tofu)
set -g @catppuccin_window_text ' #W'                 # inactive tab label
set -g @catppuccin_window_current_text ' #W'         # active tab label
# Feed catppuccin OUR theme-aware pane-border colours. It applies these options
# itself (set -ogq won't overwrite what we set first here), so there's no
# load-order fight. #{client_theme} picks latte/light vs mocha/dark at load; the
# client-*-theme hooks re-apply live on a switch (see theme.sh below).
set -g @catppuccin_pane_border_style        "#{?#{==:#{client_theme},light},fg=#bcc0cc,fg=#45475a}"
set -g @catppuccin_pane_active_border_style "#{?#{==:#{client_theme},light},fg=#8839ef#,bold,fg=#cba6f7#,bold}"


# Module colours must be set BEFORE tpm runs. catppuccin BAKES each status
# module into a finished string at load time, so anything set after the boot
# line below lands too late to change it -- and then a reload silently fixes
# it, because the second pass re-bakes with the options the first pass left
# behind. That made a fresh server and a reloaded one wear different colours.
# calm palette: mute cpu + battery to surface grey, let the clock be the accent
set -g @catppuccin_status_cpu_icon_bg     "#45475a"
set -g @catppuccin_status_cpu_text_bg     "#313244"
set -g @cpu_low_bg_color    "#45475a"
set -g @cpu_medium_bg_color "#45475a"
set -g @cpu_high_bg_color   "#45475a"
set -g @cpu_low_fg_color    "#cdd6f4"
set -g @cpu_medium_fg_color "#cdd6f4"
set -g @cpu_high_fg_color   "#cdd6f4"
set -g @catppuccin_status_battery_icon_bg   "#45475a"
set -g @catppuccin_status_battery_icon_fg   "#cdd6f4"
set -g @catppuccin_status_date_time_icon_bg "#cba6f7"   # mauve = the one accent
set -g @catppuccin_date_time_text " %H:%M"

# ── Boot TPM — MUST stay the LAST line of the plugin/theme section ───────────
run '~/.tmux/plugins/tpm/tpm'

# TPM installs its own bindings while loading. Rebind the actions documented by
# nachimux after TPM so direct plugin shortcuts get the cue too.
# Workspace switcher: tmux's native choose-tree (zoomed, session level).
# There used to be an `unbind W` here to drop an old switcher. It is gone: W
# now opens recent-workspaces (see the WORKSPACES section), and this runs
# after that binding, so the unbind was silently deleting it on every load.
# -K renumbers the quick-pick shortcuts to the number row: line 0 → 1, … 8 → 9,
# 9 → 0 (so they start at 1, not tmux's default 0). Numbers follow display order,
# so re-sorting the list (O / r) renumbers automatically — top item is always 1.
bind w   run-shell -b "#{@nachimux_cue_action}" \; choose-tree -Zs -K '#{?#{<:#{line},9},#{e|+:#{line},1},#{?#{==:#{line},9},0,}}'
bind C-s run-shell -b "#{@nachimux_cue_action}" \; run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh
bind C-r run-shell -b "#{@nachimux_cue_action}" \; run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh \
  \; run-shell -b "#{@nachimux_root}/scripts/restore-hint.sh clear"
bind I   run-shell -b "#{@nachimux_cue_action}" \; run-shell ~/.tmux/plugins/tpm/bindings/install_plugins
# TPM's update-plugins was on prefix U; that key now removes a tab from the
# current workspace (see FOCUS above), which you reach for far more often than
# a plugin update. Moved here rather than silently dropped.
bind C-u run-shell -b "#{@nachimux_cue_action}" \; run-shell ~/.tmux/plugins/tpm/bindings/update_plugins


# ── Which split is active (set AFTER tpm — catppuccin owns pane-border styles) ─
# tmux borders are shared cell-lines between panes, so the default "colour the
# line" is ambiguous. Instead: dim inactive panes, give the active one a mauve
# border, and show arrow indicators pointing at it. (Line weight is global — the
# colour + arrows + dimming do the "which one" work, not the thickness.)
set -g pane-border-lines      heavy                     # chunky ~2px box lines
set -g pane-border-indicators both                      # colour + arrows at active
# The dim/active COLOURS must flip with the terminal's light/dark theme — a
# light "dim" grey on a dark bg reads as dim, but on a light bg reads as MORE
# focused. theme.sh picks the palette; the hooks re-apply it live the
# instant the terminal switches theme (tmux reports it via #{client_theme}).
# NOT backgrounded: the palette has to exist before the bar first draws.
run-shell "#{@nachimux_root}/scripts/theme.sh"
set-hook -g client-light-theme "run-shell -b '#{@nachimux_root}/scripts/theme.sh light'"
set-hook -g client-dark-theme  "run-shell -b '#{@nachimux_root}/scripts/theme.sh dark'"


# ════════════════════════════════════════════════════════════════════════════
#  STATUS CONTENT  (set AFTER tpm so catppuccin's modules exist)
#    left  = workspace name        center = tabs        right = cpu/ram/batt/clock
# ════════════════════════════════════════════════════════════════════════════

# The workspace name, then which branch the tab you are looking at is on.
# Absent when the tab is not in a repo, so it costs nothing where it means
# nothing. scripts/git-status.sh publishes it on movement -- see the hooks --
# rather than from a #(), because `git status` is not something to run on a
# timer forever.
set -g @nachimux_git ""
set -g status-left "#{E:@catppuccin_status_session}#{?@nachimux_git,#[fg=#{@nachimux_c_tabdim}]#[bg=default]  #{@nachimux_git} #[default],}"
# Prefix feedback: while tmux waits for the command key, replace the normal
# right-side modules with a compact cheat strip. It clears on the next key.
set -g @nachimux_status_right_normal ""
set -agF @nachimux_status_right_normal "#{E:@catppuccin_status_cpu}"
set -agF @nachimux_status_right_normal "#{E:@catppuccin_status_battery}"
# Muted is a state you can see, not a setting you have to remember. This sits
# in the bar for as long as the cues are off and vanishes the moment they are
# back, so "why is it silent" is never a question. Glyph is an option for the
# same reason the zoom marker is: fonts differ, and tofu is worse than plain.
set -g  @nachimux_mute_glyph "🔇"
set -ag @nachimux_status_right_normal "#{?@nachimux_muted,#[fg=#{@nachimux_c_tabname}]#[bg=#{@nachimux_c_tabbg}] #{@nachimux_mute_glyph} #[default],}"
# Global "needs you" badge: yellow  🔔 N  whenever ANY tab in ANY workspace is
# flagged (Claude hook or bell). Absent at zero, so it simply is not there.
# The count comes from an option kept current by the four events that can change
# it (see the hooks up in the ATTENTION section) -- not from a #() the bar re-ran
# every few seconds to be told "still nothing". Drawn here with the rest of the
# bar, so it wears the theme palette instead of its own hardcoded yellow.
set -ag @nachimux_status_right_normal "#{?@nachimux_attn_count,#[fg=#{@nachimux_c_attnink}]#[bg=#{@nachimux_c_attnbg}]#[bold] 🔔 #{@nachimux_attn_count} #[default],}"
set -ag  @nachimux_status_right_normal "#{E:@catppuccin_status_date_time}"
# The prefix cheat strip is data-driven now: scripts/prefix-hint.sh renders your
# pinned shortcuts into @nachimux_prefix_hint. Toggle which ones show from the
# palette -> "Customize the prefix hint bar". Pins live in a state file and are
# rebuilt on every reload (below), so nothing changes until you customize.
set -g @nachimux_prefix_hint ""
# The prefix hint and the choose-tree hint live on a SECOND status row (below the
# tabs) so they never crowd the tab bar. Line 0 (top) = session + centered tabs;
# line 1 = normal modules (cpu/ram/clock) on the right, with the green prefix hint
# (while holding prefix) or the mauve tree hint (in the switcher) on the left.
set -g @nachimux_tree_hint "#[fg=#{@nachimux_c_mauve}]#[bg=default]#[fg=#{@nachimux_c_mauveink}]#[bg=#{@nachimux_c_mauve}]#[bold] Enter #[nobold]open · #[bold]x #[nobold]kill · #[bold]C-s #[nobold]find · #[bold]O #[nobold]sort · #[bold]v #[nobold]preview · #[bold]F1 #[nobold]help · #[bold]q #[nobold]quit #[fg=#{@nachimux_c_mauve}]#[bg=default]#[default]"
# While a digit is waiting for its follow-up, the last row says what the tab bar
# is showing you, and names the way out so it can never feel like a trap.
set -g @nachimux_tabsN_hint "#[fg=#{@nachimux_c_accent}]#[bg=default]#[fg=#{@nachimux_c_accentink}]#[bg=#{@nachimux_c_accent}]#[bold] TAB #{@nachimux_tens} #[nobold]#[bold]Enter#[nobold] go here · #[bold]0-9#[nobold] for #{@nachimux_tens}0-#{@nachimux_tens}9 · #[bold]Esc#[nobold] cancel #[fg=#{@nachimux_c_accent}]#[bg=default]#[default]"
set -g status 2
set -g message-line 1         # transient messages land on row 2, not over the tabs
set -g status-right ""
# ── Two rows of tabs, but only when you have two rows of tabs ──────────────
# tmux draws the whole window list in one #{W:} loop on one row, and hides the
# overflow behind < > markers. With 14 tabs that silently swallowed four of
# them. So: run the loop TWICE, each row filtering to the tabs it owns.
#
#   row 0   the first N tabs
#   row 1   the rest
#
# The cut is for balance, by rendered width, and scripts/tab-rows.sh makes it --
# a format cannot. The #{W:} loop exposes no ordinal position, so no format can
# know a tab is "the sixth of eleven", and #{>=:9,10} is TRUE because those
# operators compare strings. The script decides and writes @nachimux_row on
# each window; the rows below are then a flat equality test, which is the one
# comparison that cannot go wrong.
# Windows with no assignment yet fall to row 0, so a tab is never invisible.
#
# scripts/tab-rows.sh then decides per workspace whether row 1 is tabs-10+ or
# the hint row, and sets status 2 vs 3 to match, so a workspace that never
# passes 9 tabs pays nothing for this. The rows are named options so that
# script only ever repoints them and never has to know how they look.
# The left of this row is otherwise empty, which makes it the right home for the
# saved-layout offer: permanently visible without ever competing with the tabs,
# and gone the moment you restore or dismiss.
# It does step aside for whatever the CENTRE of this row is showing, though --
# a centred hint is wider than the gap the offer leaves, and the two were
# overwriting each other. While you are holding a key down you want the keys.
# Note every operand of #{||:} is wrapped in #{}: a bare `client_prefix` is
# passed as the literal STRING, which is non-empty, which is TRUE -- so the
# condition fires always and the offer never appears.
set -g @nachimux_row_hints "#[align=left]#{?#{||:#{client_prefix},#{||:#{==:#{client_key_table},tabsN},#{==:#{pane_mode},tree-mode}}},,#{E:@nachimux_restore_hint}}#[align=centre]#{?#{==:#{client_key_table},tabsN},#{E:@nachimux_tabsN_hint},#{?client_prefix,#{E:@nachimux_prefix_hint},#{?#{==:#{pane_mode},tree-mode},#{E:@nachimux_tree_hint},}}}#[align=right]#{E:@nachimux_status_right_normal}"
# One tab, wrapped in the bits that keep the mouse working: range=window makes
# it clickable, list=focus tells tmux which tab to keep on screen when the row
# has to scroll. Separate options because a #[fg=X,bg=Y] comma inside the
# #{?…,…,…} filters below would split the conditional.
set -g @nachimux_wsep "#[fg=default]#[bg=default] "
set -g @nachimux_wtab "#[range=window|#{window_index}]#{T:window-status-format}#[norange default]"
set -g @nachimux_wcur "#[range=window|#{window_index} list=focus]#{T:window-status-current-format}#[norange list=on default]"
# The same loop twice, mirrored on @nachimux_row. Each #{W:inactive,active} pair
# renders the tab or nothing, so a tab appears on exactly one row.
set -g @nachimux_row_tabs1 "#{W:#{?#{==:#{@nachimux_row},2},,#{E:@nachimux_wsep}#{E:@nachimux_wtab}},#{?#{==:#{@nachimux_row},2},,#{E:@nachimux_wsep}#{E:@nachimux_wcur}}}"
set -g @nachimux_row_tabs2 "#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{?#{==:#{@nachimux_row},2},#{E:@nachimux_wsep}#{E:@nachimux_wtab},},#{?#{==:#{@nachimux_row},2},#{E:@nachimux_wsep}#{E:@nachimux_wcur},}}#[nolist]"
# Row 0 is the stock status-format[0] with our filtered loop swapped in for the
# default one — the surrounding push-default/range/list scaffolding is tmux's,
# and dropping it would cost the status-left styling and the overflow markers.
# Row 0 is the stock status-format[0] with our filtered loop swapped in for the
# default one — the surrounding push-default/range/list scaffolding is tmux's,
# and dropping it would cost the status-left styling and the overflow markers.
# It lives in an option because tab-rows.sh has to re-set EVERY row it wants on
# a session: tmux array options do not merge, so the moment a session gets its
# own status-format[1] it stops inheriting the global status-format[0] and that
# row silently goes blank. Naming it here means the script re-points row 0 at
# the same text instead of carrying a copy of it.
set -g @nachimux_row_main "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{E:@nachimux_row_tabs1}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-format[0] "#{E:@nachimux_row_main}"
set -g status-format[1] "#{E:@nachimux_row_hints}"
# Re-decide whenever a workspace gains or loses a tab, or you attach to one.
set-hook -g window-linked   "run-shell -b '#{@nachimux_root}/scripts/tab-rows.sh'"
# One declaration per hook name. `set-hook -g` REPLACES rather than appends, so a
# second `set-hook -g window-unlinked` anywhere in this file would silently
# delete this one -- and `-ag` is not the fix either, since sourcing the config
# again would then stack duplicates on every reload. Chain with `;` instead,
# which is what the client-session-changed hook up in TABS already does.
set-hook -g window-unlinked "run-shell -b '#{@nachimux_root}/scripts/tab-rows.sh' ; run-shell -b '#{@nachimux_root}/scripts/attention.sh'"
set-hook -g session-created "run-shell -b '#{@nachimux_root}/scripts/tab-rows.sh' ; run-shell -b '#{@nachimux_root}/scripts/restore-hint.sh check'"
set-hook -g client-attached "run-shell -b '#{@nachimux_root}/scripts/tab-rows.sh' ; run-shell -b '#{@nachimux_root}/scripts/restore-hint.sh check'"
# Width decides the split, so a resize has to re-decide it.
set-hook -g client-resized  "run-shell -b '#{@nachimux_root}/scripts/tab-rows.sh'"
# Killing the FOCUS workspace by any route -- prefix X on its last tab, or just
# killing the session -- has to put window-size back. Deriving it from "does
# FOCUS exist right now" means no path can forget to.
set-hook -g session-closed  "run-shell -b '#{@nachimux_root}/scripts/focus.sh size'"
# So does renaming a tab -- names are what the balance is measured in.
set-hook -g window-renamed  "run-shell -b '#{@nachimux_root}/scripts/tab-rows.sh'"
run-shell -b "#{@nachimux_root}/scripts/tab-rows.sh"
run-shell -b "#{@nachimux_root}/scripts/prefix-hint.sh build"

# ── Clean SQUARE tabs (explicit colors — avoids catppuccin's reverse/none) ──
# No caps, no rounded corners: every tab is a plain rectangle of colour, and the
# tabs are held apart by one bar-coloured (black) space — the separator below.
# The label reads "#/Name": index and slash in dim grey, the name bright.
set -g window-status-separator "#[fg=default,bg=default] "

# ── The tab index is a live affordance, not decoration ─────────────────────
# It repaints itself to answer "what can I press right now?", in three states:
#   idle           dim grey — just a label
#   prefix held    lime — every index is one keypress away (prefix 1 … 9)
#   prefix N held  the decade N is being asked about, so:
#                    tab N        lime + bold  — Enter lands here
#                    tabs N0-N9   dim tens digit, lime UNITS digit — type it
#                    everything else greys out, it is not on offer
# Colours only — never bg — so these compose over any pill background. Kept as
# separate options because a #[fg=X,bg=Y] comma inside a #{?a,b,c} would split
# the conditional; single-property #[fg=X] is always safe to nest. The hexes
# themselves live in scripts/theme.sh and flip with the terminal.
# A zoomed split used to be invisible: @catppuccin_window_flags is none (it
# rendered as tofu) and our own formats never read window_zoomed_flag, so
# prefix z could hide three splits with nothing on screen saying so. The marker
# is an option rather than a literal because the right glyph depends on the
# font: Z is tmux's own convention and cannot tofu, but a Nerd Font icon drops
# in here without touching a format string.
set -g @nachimux_zoom_glyph "Z"
set -g @nachimux_n_dim  "#[fg=#{@nachimux_c_tabdim}]"
set -g @nachimux_n_hot  "#[fg=#{@nachimux_c_numhot}]"
set -g @nachimux_n_off  "#[fg=#{@nachimux_c_numoff}]"
set -g @nachimux_na_dim "#[fg=#{@nachimux_c_attndim}]"
set -g @nachimux_na_hot "#[fg=#{@nachimux_c_attnhot}]"
set -g @nachimux_na_off "#[fg=#{@nachimux_c_attnoff}]"
# "Is this index in the armed decade?" without putting a format inside an
# fnmatch pattern: #{m:??,…} is "exactly two characters", and #{=1:…} pulls the
# tens digit out to compare against the armed one. #{=-1:…} is then the units
# digit — the one key that reaches this tab.
set -g @nachimux_in_dec "#{&&:#{m:??,#{window_index}},#{==:#{=1:#{window_index}},#{@nachimux_tens}}}"
set -g @nachimux_num "#{?#{==:#{client_key_table},tabsN},#{?#{==:#{window_index},#{@nachimux_tens}},#{E:@nachimux_n_hot}#[bold]#{window_index}#[nobold],#{?#{E:@nachimux_in_dec},#{E:@nachimux_n_off}#{=1:#{window_index}}#{E:@nachimux_n_hot}#{=-1:#{window_index}},#{E:@nachimux_n_off}#{window_index}}},#{?client_prefix,#{E:@nachimux_n_hot}#{window_index},#{E:@nachimux_n_dim}#{window_index}}}"
set -g @nachimux_num_attn "#{?#{==:#{client_key_table},tabsN},#{?#{==:#{window_index},#{@nachimux_tens}},#{E:@nachimux_na_hot}#[bold]#{window_index}#[nobold],#{?#{E:@nachimux_in_dec},#{E:@nachimux_na_off}#{=1:#{window_index}}#{E:@nachimux_na_hot}#{=-1:#{window_index}},#{E:@nachimux_na_off}#{window_index}}},#{?client_prefix,#{E:@nachimux_na_hot}#{window_index},#{E:@nachimux_na_dim}#{window_index}}}"

# Inactive tabs. The two blocks are stored as options because their internal
# commas (fg=X,bg=Y) would otherwise collide with the #{?cond,a,b} separators.
# A tab asking for you (@attention or bell) uses the yellow block with a 🔔.
set -g @nachimux_tab_normal "#[fg=#{@nachimux_c_tabdim}]#[bg=#{@nachimux_c_tabbg}] #{E:@nachimux_num}#[fg=#{@nachimux_c_tabdim}]/#[fg=#{@nachimux_c_tabname}]#W#{?window_zoomed_flag, #{@nachimux_zoom_glyph},} #[default]"
set -g @nachimux_tab_attn "#[fg=#{@nachimux_c_attndim}]#[bg=#{@nachimux_c_attnbg}] #{E:@nachimux_num_attn}#[fg=#{@nachimux_c_attndim}]/#[fg=#{@nachimux_c_attnink}]#[bold]🔔#W#{?window_zoomed_flag, #{@nachimux_zoom_glyph},} #[default]"
set -g window-status-format "#{?#{||:#{@attention},#{window_bell_flag}},#{E:@nachimux_tab_attn},#{E:@nachimux_tab_normal}}"
# Active tab wears the same lime green as the prefix hint, so "where am I" and
# "tmux is listening" speak one colour. Its index stays dark: it is the one tab
# you never need to jump to, so it sits out the lime/units-digit signalling.
set -g window-status-current-format "#[fg=#{@nachimux_c_curidx}]#[bg=#{@nachimux_c_curbg}] #I/#[fg=#{@nachimux_c_curink}]#[bold]#W#{?window_zoomed_flag, #{@nachimux_zoom_glyph},} #[default]"
